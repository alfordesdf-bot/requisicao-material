<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Requisição - Universal Motors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ECRÃ DE LOGIN -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <h1 class="brand-title">UNIVERSAL MOTORS</h1>
      <hr class="divider">
      <p class="login-question">Quem está a solicitar o material?</p>
      <div class="login-form">
        <input type="text" id="username-input" class="input-dark" placeholder="Digite o seu nome completo..." autocomplete="off">
        <button id="btn-login" class="btn-gold">Continuar</button>
      </div>
    </div>
  </div>

  <!-- PORTAL PRINCIPAL (Catálogo) -->
  <div id="main-portal" class="main-portal hidden">
    <header>
      <h1 class="brand-title">REQUISIÇÃO DE MATERIAL</h1>
      <hr class="divider">
      <div class="header-actions">
        <div class="user-badge">
          <span>Colaborador: <strong id="display-username">--</strong></span>
          <button id="btn-logout" class="btn-link">Sair</button>
        </div>
        <button id="btn-ver-historico" class="btn-outline-gold">Ver Histórico de Pedidos</button>
      </div>
    </header>

    <main class="catalog-grid">
      <article class="card">
        <div class="card-image"><img src="fotos/EPI/artigo1.jpg" alt="Luvas de Proteção"></div>
        <div class="card-content">
          <span class="tag">Segurança / EPI</span>
          <h2 class="card-title">Luvas de Proteção</h2>
          <div class="card-actions">
            <input type="number" class="input-dark quantity-input" value="1" min="1">
            <button class="btn-gold btn-add-item">Adicionar</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-image"><img src="fotos/ferramentas/artigo1.jpg" alt="Aparafusadora 18V"></div>
        <div class="card-content">
          <span class="tag">Máquinas / Produção</span>
          <h2 class="card-title">Aparafusadora 18V</h2>
          <div class="card-actions">
            <input type="number" class="input-dark quantity-input" value="1" min="1">
            <button class="btn-gold btn-add-item">Adicionar</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-image"><img src="fotos/caderno_caneta/artigo1.jpg" alt="Bloco e Caneta"></div>
        <div class="card-content">
          <span class="tag">Escritório / Apoio</span>
          <h2 class="card-title">Bloco A5 + Caneta</h2>
          <div class="card-actions">
            <input type="number" class="input-dark quantity-input" value="1" min="1">
            <button class="btn-gold btn-add-item">Adicionar</button>
          </div>
        </div>
      </article>
    </main>

    <!-- NOVA SECÇÃO: Observações e Botões Duplos -->
    <div class="observations-container" style="margin-top: 2rem; background-color: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
      <label for="order-notes" class="brand-title" style="display: block; font-size: 1rem; margin-bottom: 1rem;">Informação adicional relativa ao pedido</label>
      <textarea id="order-notes" class="input-dark" rows="4" style="width: 100%; resize: vertical; font-family: inherit;" placeholder="Escreva aqui observações sobre o pedido..."></textarea>
    </div>

    <div class="submit-container" style="display: flex; gap: 1rem; margin-top: 1.5rem;">
      <button id="btn-ver-pedido" class="btn-outline-gold btn-large" style="margin-top: 0;">Ver Pedido</button>
      <button id="btn-submit-order" class="btn-gold btn-large" style="margin-top: 0;">Submeter</button>
    </div>
  </div>

  <!-- ECRÃ DE RESUMO DO PEDIDO -->
  <div id="summary-overlay" class="login-overlay hidden">
    <div class="login-card summary-card-layout">
      <h1 class="brand-title">REQUISIÇÃO CONCLUÍDA</h1>
      <hr class="divider">
      <div class="summary-details">
        <p class="summary-info"><span class="label-gold">Colaborador:</span> <span id="final-username"></span></p>
        <p class="summary-info"><span class="label-gold">Materiais Solicitados:</span></p>
        
        <div class="dark-box-list">
          <ul id="summary-list" class="summary-list">
            <!-- JS injeta aqui -->
          </ul>
        </div>
      </div>
      
      <div class="summary-buttons">
        <button id="btn-edit-order" class="btn-outline-gold">Editar Requisição</button>
        <button id="btn-new-order" class="btn-gold">Nova Requisição</button>
      </div>
    </div>
  </div>

  <!-- ECRÃ DE HISTÓRICO -->
  <div id="historico-overlay" class="login-overlay hidden">
    <div class="login-card" style="max-width: 800px; width: 90%;">
      <h1 class="brand-title">HISTÓRICO DE REQUISIÇÕES</h1>
      <hr class="divider">
      
      <div id="historico-container" class="historico-container">
        <!-- JS injeta os cartões de histórico aqui -->
      </div>

      <button id="btn-voltar-catalogo" class="btn-outline-gold" style="margin-top: 2rem;">Voltar ao Catálogo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
